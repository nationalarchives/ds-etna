  service-status:
    container_name: service-status
    image: ghcr.io/nationalarchives/ds-service-status:26.08.05.145
    env_file:
      - .env
    environment:
      - APPLICATION_PROTOCOL=http
      - ENVIRONMENT_NAME=staging
      - CONFIG=config.Staging
      - SECRET_KEY=${SECRET_KEY}
      - COOKIE_DOMAIN=tna.dblclk.dev
      - CSP_STYLE_SRC='self',https://www.nationalarchives.gov.uk/enrichment/,https://fonts.googleapis.com,https://p.typekit.net,https://use.typekit.net
      - CSP_FONT_SRC='self',https://fonts.gstatic.com,https://use.typekit.net
      - CSP_IMG_SRC='self',https://www.nationalarchives.gov.uk/enrichment/
      - CSP_SCRIPT_SRC='self',https://www.nationalarchives.gov.uk/enrichment/
      - CSP_CONNECT_SRC='self',https://www.nationalarchives.gov.uk/enrichment/
      - UPTIME_KUMA_URL=https://uptime.tna.dblclk.dev
      - UPTIME_KUMA_STATUS_PAGE_SLUG=nationalarchives
      - UPTIME_KUMA_JWT=${UPTIME_KUMA_JWT}
      - ALLOW_INSECURE=true
      - CACHE_DEFAULT_TIMEOUT=300
      - _SENTRY_DSN=https://f0dfd41f5e17da117bde6cde2371045f@o1230303.ingest.us.sentry.io/4509966773387264
    expose:
      - 8080
  forms:
    container_name: forms
    image: ghcr.io/nationalarchives/ds-forms:26.03.25.100
    env_file:
      - .env
    environment:
      - APPLICATION_PROTOCOL=http
      - ENVIRONMENT_NAME=staging
      - CONFIG=config.Staging
      - SECRET_KEY=${SECRET_KEY}
      - COOKIE_DOMAIN=tna.dblclk.dev
      - CSP_STYLE_SRC='self',https://fonts.googleapis.com,https://p.typekit.net,https://use.typekit.net
      - CSP_FONT_SRC='self',https://fonts.gstatic.com,https://use.typekit.net
      - ALLOW_INSECURE=true
      - SESSION_REDIS_URL=redis://redis:6379/0
      - RATELIMIT_REDIS_URL=redis://redis:6379/1
      - RATELIMIT_DEFAULT=4 per 2 seconds
      - ALTCHA_HMAC_KEY=${SECRET_KEY}
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_URL=redis://redis:6379/2
    expose:
      - 8080
  redis:
    container_name: redis
    image: redis:latest
    # command: /bin/sh -c "redis-server --user redis --requirepass ${REDIS_PASSWORD}"
    # env_file:
    #   - .env
    # environment:
    #   - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - 3001:3001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - uptime_kuma2:/app/data
      - ./uptime_kuma_data:/app_data
      - ../uptime_kuma_backups:/backup
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - 8000:8000
      - 9000:9000
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
  matomo:
    container_name: matomo
    image: matomo:fpm-alpine
    env_file:
      - .env
    environment:
      - MATOMO_DATABASE_HOST=mysql
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_USERNAME=matomo
      - MATOMO_DATABASE_PASSWORD=${MYSQL_MATOMO_PASSWORD}
      - MATOMO_DATABASE_DBNAME=matomo
    restart: unless-stopped
    volumes:
      - matomo_data:/var/www/html:rw
  mysql:
    container_name: mysql
    image: mysql:lts
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo
      - MYSQL_PASSWORD=${MYSQL_MATOMO_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql:rw
volumes:
  pgdata:
  media:
  redis_data:
  uptime_kuma:
  uptime_kuma2:
  portainer_data:
  matomo_data:
  mysql_data:
