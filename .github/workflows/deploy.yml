name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: test-local-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /root/ds-etna
          git pull --ff-only
          bash ./update.sh

